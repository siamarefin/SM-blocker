<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SM Blocker</title>

  <style>
    body {
      width: 250px;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    #start {
      background: #1877f2;
      color: white;
    }

    #stop {
      background: #ddd;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>SM Blocker</h2>

  <button id="start">Start</button>
  <button id="stop">Stop</button>

  <div id="status">Loading...</div>

  <script src="popup.js"></script>
  
  <div>
    <p>Today's Facebook Usage</p>
    <h2 id="usage">0s</h2>
  </div>

</body>
</html>
