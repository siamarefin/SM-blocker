<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SM Blocker</title>

  <style>
    body {
      width: 250px;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    #start {
      background: #1877f2;
      color: white;
    }

    #stop {
      background: #ddd;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>SM Blocker</h2>

  <button id="start">Start</button>
  <button id="stop">Stop</button>

  <div id="status">Loading...</div>

  <script>
    const status = document.getElementById("status");

    async function updateStatus() {
      const data = await chrome.storage.local.get([
        "enabled",
        "state"
      ]);

      if (data.enabled) {
        status.textContent = `Status: ${data.state}`;
      } else {
        status.textContent = "Status: OFF";
      }
    }

    document.getElementById("start").addEventListener("click", async () => {
      await chrome.storage.local.set({
        enabled: true,
        state: "ACTIVE",
        usageStartedAt: null,
        blockedUntil: null
      });

      updateStatus();
    });

    document.getElementById("stop").addEventListener("click", async () => {
      await chrome.storage.local.set({
        enabled: false,
        state: "INACTIVE",
        usageStartedAt: null,
        blockedUntil: null
      });

      chrome.alarms.clear("usageTimer");
      chrome.alarms.clear("blockTimer");

      updateStatus();
    });

    updateStatus();
  </script>

</body>
</html>
