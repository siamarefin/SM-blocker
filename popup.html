<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SM Blocker</title>

  <style>
    body {
      width: 250px;
      padding: 20px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h2 {
      margin-top: 0;
    }

    #usage {
      font-size: 32px;
      margin: 10px 0 20px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    #start {
      background: #1877f2;
      color: white;
    }

    #stop {
      background: #ddd;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h2>SM Blocker</h2>

  <p>Today's Facebook Usage</p>

  <div id="usage">0s</div>

  <div id="status">Loading...</div> 

    <!-- <button id="start">Start</button>
    <button id="stop">Stop</button> --> 

    <div class="feature">
        <span>Image Blur</span>

        <label>
            <input type="checkbox" id="imageBlur">
            ON
        </label>
    </div>

  <script src="popup.js"></script>

</body>
</html>
